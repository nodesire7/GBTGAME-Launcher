name: sync-release

on:
  schedule:
    - cron: '7 * * * *'   # hourly
  workflow_dispatch: {}

permissions:
  contents: write        # create mirrored releases + push commits

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mirror latest release from source repo
        run: python scripts/mirror_releases.py
        env:
          SOURCE_REPO: nodesire7/GBTGAME-D-Launcher-v3.0
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      - name: Update index.html
        run: python scripts/update_release.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG=$(python -c "import json;print(json.load(open('release/release.json',encoding='utf-8'))['tag'])")
          git add -A
          if git diff --cached --quiet; then
            echo "no changes (already at $TAG)"
          else
            git commit -m "sync: mirror release $TAG"
            git push
          fi
        env:
          GH_TOKEN: ${{ github.token }}
