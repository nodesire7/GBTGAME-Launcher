name: Enhance UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/enhance_page.py
      - .github/workflows/enhance-ui.yml

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enhance page
        run: python3 scripts/enhance_page.py

      - name: Commit page
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enhance animations and SVG icons"
          git push
