name: Apply site links

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-site-links.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 顶部导航：视频、论坛、网盘
          if 'href="https://bbs.gbtgame.me"' not in s:
              old = '''\t\t\t\t<a href="#download">下载</a>\n\t\t\t\t<a href="#architecture">启动链路</a>'''
              new = '''\t\t\t\t<a href="#download">下载</a>\n\t\t\t\t<a href="#video">视频</a>\n\t\t\t\t<a href="https://bbs.gbtgame.me" target="_blank" rel="noopener noreferrer">论坛</a>\n\t\t\t\t<a href="https://pan.gbtgame.me" target="_blank" rel="noopener noreferrer">网盘</a>\n\t\t\t\t<a href="#architecture">启动链路</a>'''
              s = s.replace(old, new, 1)

          # Hero 快捷入口
          if 'href="https://bbs.gbtgame.me" class="btn btn-secondary"' not in s:
              old = '\t\t\t\t\t<a href="#community" class="btn btn-secondary">加入社区</a>'
              new = old + '\n\t\t\t\t\t<a href="https://bbs.gbtgame.me" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">GBTGAME 论坛</a>\n\t\t\t\t\t<a href="https://pan.gbtgame.me" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">GBTGAME 网盘</a>'
              s = s.replace(old, new, 1)

          # 如果视频区不存在则补充 Bilibili 视频
          if 'id="video"' not in s:
              if '.video-wrap {' not in s:
                  marker = '\t\t.section-small {\n\t\t\tpadding: 65px 0;\n\t\t}\n'
                  css = marker + '''\n\t\t.video-wrap {\n\t\t\tposition: relative;\n\t\t\twidth: min(1000px, 100%);\n\t\t\tmargin: 0 auto;\n\t\t\taspect-ratio: 16 / 9;\n\t\t\tborder-radius: 16px;\n\t\t\toverflow: hidden;\n\t\t\tborder: 1px solid rgba(255, 255, 255, .1);\n\t\t\tbackground: #0d1016;\n\t\t\tbox-shadow: 0 24px 70px rgba(0, 0, 0, .45);\n\t\t}\n\n\t\t.video-wrap iframe {\n\t\t\tposition: absolute;\n\t\t\tinset: 0;\n\t\t\twidth: 100%;\n\t\t\theight: 100%;\n\t\t\tborder: 0;\n\t\t}\n'''
                  s = s.replace(marker, css, 1)

              marker = '\t\t<section class="section" id="download">'
              video = '''\t\t<section class="section-small" id="video">\n\t\t\t<div class="container">\n\t\t\t\t<div class="section-head">\n\t\t\t\t\t<div class="section-label">Video</div>\n\t\t\t\t\t<h2 class="section-title">视频演示</h2>\n\t\t\t\t\t<p class="section-desc">观看 B 站视频，了解 GBTGAME Launcher 的安装与使用方法。</p>\n\t\t\t\t</div>\n\t\t\t\t<div class="video-wrap">\n\t\t\t\t\t<iframe src="https://player.bilibili.com/player.html?bvid=BV1mDgK6ZE5z&autoplay=0" title="GBTGAME Launcher 视频演示" allowfullscreen loading="lazy" scrolling="no" frameborder="0"></iframe>\n\t\t\t\t</div>\n\t\t\t\t<p style="text-align:center; margin-top:14px; color:#89919d; font-size:13px;"><a href="https://www.bilibili.com/video/BV1mDgK6ZE5z" target="_blank" rel="noopener noreferrer" style="color:#8692ff; font-weight:700;">在 Bilibili 打开原视频 →</a></p>\n\t\t\t</div>\n\t\t</section>\n\n'''
              s = s.replace(marker, video + marker, 1)

          # 正文 GBTGAME 服务区
          if 'id="services"' not in s:
              marker = '\t\t<section class="section" id="community">'
              services = '''\t\t<section class="section-small" id="services">\n\t\t\t<div class="container">\n\t\t\t\t<div class="section-head">\n\t\t\t\t\t<div class="section-label">GBTGAME Services</div>\n\t\t\t\t\t<h2 class="section-title">GBTGAME 服务</h2>\n\t\t\t\t\t<p class="section-desc">访问 GBTGAME 论坛获取社区内容，或进入 GBTGAME 网盘浏览与下载资源。</p>\n\t\t\t\t</div>\n\t\t\t\t<div class="feature-grid">\n\t\t\t\t\t<a class="feature" href="https://bbs.gbtgame.me" target="_blank" rel="noopener noreferrer">\n\t\t\t\t\t\t<div class="feature-icon">BBS</div>\n\t\t\t\t\t\t<div><h3>GBTGAME 论坛</h3><p>bbs.gbtgame.me · 社区交流、游戏内容与问题讨论。</p></div>\n\t\t\t\t\t</a>\n\t\t\t\t\t<a class="feature" href="https://pan.gbtgame.me" target="_blank" rel="noopener noreferrer">\n\t\t\t\t\t\t<div class="feature-icon">PAN</div>\n\t\t\t\t\t\t<div><h3>GBTGAME 网盘</h3><p>pan.gbtgame.me · GBTGAME 资源与软件下载入口。</p></div>\n\t\t\t\t\t</a>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t</section>\n\n'''
              s = s.replace(marker, services + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add video, forum and pan links"
          git push
